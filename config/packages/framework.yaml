# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    default_locale: ua
    #csrf_protection: true
    #http_method_override: true

    # Allow overriding the trusted proxy list per-environment (Cloudflare, ALB,
    # an outer nginx on the host, etc.). REMOTE_ADDR keeps the immediate peer
    # — the docker nginx — trusted, and private_ranges covers the docker
    # bridge. Set TRUSTED_PROXIES in .env.prod / .env.local for any additional
    # public-IP proxy in front of nginx.
    trusted_proxies: '%env(default:default_trusted_proxies:TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        storage_factory_id: session.storage.factory.native
        # Keep admin logged in for ~1 month (cookie + server-side session).
        cookie_lifetime: 2592000
        gc_maxlifetime: 2592000

    #esi: true
    #fragments: true
    php_errors:
        log: true
    #error_controller: App\Controller\ErrorController::show

    translator:
      default_path: '%kernel.project_dir%/translations'
      fallbacks: ['ua']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

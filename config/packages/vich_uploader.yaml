vich_uploader:
  db_driver: orm

  metadata:
    type: attribute

  mappings:
    images:
      uri_prefix: /images/products
      upload_destination: '%kernel.project_dir%/public/images/products'
      # Local files are only a staging area: ProductImageUploadSubscriber pushes
      # them to Bunny and deletes the local copy. Vich's own delete_on_* would
      # then try to unlink a missing file and throw ("Cannot remove file") → 500
      # when adding/replacing/removing product images.
      delete_on_update: false
      delete_on_remove: false
      namer:
        service: Vich\UploaderBundle\Naming\Base64Namer

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    bunny.storage.zone: '%env(BUNNY_STORAGE_ZONE)%'
    bunny.storage.api_key: '%env(BUNNY_STORAGE_API_KEY)%'
    bunny.storage.region: '%env(BUNNY_STORAGE_REGION)%'
    bunny.cdn.url: '%env(BUNNY_CDN_URL)%'
    product_images_dir: '%kernel.project_dir%/public/images/products'
    public_images_dir: '%kernel.project_dir%/public/images'
    receipt_templates_dir: '%kernel.project_dir%/templates/admin2/receipts'
    invoice_templates_dir: '%kernel.project_dir%/templates/admin2/invoices'

    # Default value for framework.trusted_proxies when TRUSTED_PROXIES env is unset.
    # See config/packages/framework.yaml.
    default_trusted_proxies: '127.0.0.1,REMOTE_ADDR,private_ranges'
    vapid_subject_default: 'mailto:x-media@x-media.com.ua'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $uploadDir: '%product_images_dir%'
            string $publicImagesDir: '%public_images_dir%'
            string $cdnUrl: '%bunny.cdn.url%'
            string $receiptTemplatesDir: '%receipt_templates_dir%'
            string $invoiceTemplatesDir: '%invoice_templates_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\EventListener\:
        resource: '../src/EventListener'

    App\EventListener\OrderSubscriber:
        tags:
            - name: 'doctrine.orm.entity_listener'

    App\EventListener\OrderNewPushListener:
        tags:
            - name: 'doctrine.orm.entity_listener'

    App\EventListener\ProductSubscriber:
        tags:
            - name: 'doctrine.orm.entity_listener'

    App\EventListener\OrderItemSubscriber:
        tags: [ 'doctrine.event_subscriber' ]

    App\EventListener\ProductImageUploadSubscriber:
        tags:
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: postUpdate }
            - { name: doctrine.event_listener, event: preRemove }
            - { name: doctrine.event_listener, event: postFlush }

    App\EventListener\ImageUploadSubscriber:
        tags:
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: postUpdate }
            - { name: doctrine.event_listener, event: preRemove }
            - { name: doctrine.event_listener, event: postFlush }

    App\Command\SyncNovaPoshtaDataCommand:
        lazy: true

    App\Service\BunnyStorageClient:
        arguments:
            $zone: '%bunny.storage.zone%'
            $apiKey: '%bunny.storage.api_key%'
            $region: '%bunny.storage.region%'
            $cdnUrl: '%bunny.cdn.url%'

    App\Service\Admin2\RozetkaSellerApiClient:
        arguments:
            $username: '%env(default::ROZETKA_SELLER_USERNAME)%'
            $password: '%env(default::ROZETKA_SELLER_PASSWORD)%'

    App\Service\Admin2\AdminWebPushNotifier:
        arguments:
            $vapidPublicKey: '%env(default::VAPID_PUBLIC_KEY)%'
            $vapidPrivateKey: '%env(default::VAPID_PRIVATE_KEY)%'
            $vapidSubject: '%env(default:vapid_subject_default:VAPID_SUBJECT)%'
